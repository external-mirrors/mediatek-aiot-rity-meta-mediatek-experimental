# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "experimental"
BBFILE_PATTERN_experimental = "^${LAYERDIR}/"
BBFILE_PRIORITY_experimental = "8"
# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Add flutter dynamic layer if flutter-layer exists
BBFILES_DYNAMIC += " \
    flutter-layer:${LAYERDIR}/dynamic-layers/flutter-layer/*/*/*.bbappend \
"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_experimental = "1"

# The flutter bbappends are added to BBFILES_DYNAMIC, so LAYERDEPENDS is optional
# LAYERDEPENDS_experimental = " \
#     flutter-layer \
#     flutter-apps-layer \
# "

LAYERSERIES_COMPAT_experimental = "scarthgap"

G01_URI           ?= "git://git@git01.mediatek.com"
G01_AIOT_URI      ?= "${G01_URI}/mediatek/aiot"
G01_AIOT_LSA_URI  ?= "${G01_AIOT_URI}/lsa"

